<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body class="landing-page">
    <header class="site-header landing-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="ShapeBit home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>ShapeBit</span>
      </a>
      <nav class="header-links landing-links" aria-label="Main navigation">
        <a href="{{ '/demo/' | relative_url }}">Demo</a>
        <a href="{{ '/docs/' | relative_url }}">Documentation</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>
  </body>
</html>
