<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="icon" href="{{ '/assets/images/shapebit-favicon.ico' | relative_url }}" sizes="any">
    <link rel="apple-touch-icon" href="{{ '/assets/images/shapebit-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body class="landing-page">
    <header class="site-header landing-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="ShapeBit home">
        <picture>
          <source media="(prefers-color-scheme: dark)" srcset="{{ '/assets/images/shapebit-wordmark.png' | relative_url }}" width="2107" height="748">
          <img class="brand-logo" src="{{ '/assets/images/shapebit-wordmark-dark.png' | relative_url }}" width="2170" height="725" alt="ShapeBit">
        </picture>
      </a>
      <nav class="header-links landing-links" aria-label="Main navigation">
        <a href="{{ '/demo/' | relative_url }}">Demo</a>
        <a href="{{ '/docs/' | relative_url }}">Documentation</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>
  </body>
</html>
