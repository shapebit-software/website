<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="icon" href="{{ '/assets/images/shapebit-favicon.ico' | relative_url }}" sizes="any">
    <link rel="apple-touch-icon" href="{{ '/assets/images/shapebit-icon.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body class="landing-page">
    <header class="site-header landing-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="ShapeBit home">
        <img class="brand-logo" src="{{ '/assets/images/shapebit-wordmark-dark.png' | relative_url }}" width="2170" height="725" alt="ShapeBit">
      </a>
      <nav class="header-links landing-links" aria-label="Main navigation">
        <a href="{{ '/docs/' | relative_url }}">Documentation</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>
    {% include analytics.html %}
  </body>
</html>
